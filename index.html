<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bahama Rush 3D</title>
<style>
  :root { --navy:#0b2a4a; --gold:#ffc93c; color-scheme:dark; }
  html,body { height:100%; margin:0; background:var(--navy); color:#fff; overflow:hidden; touch-action:none;
    font-family:"Trebuchet MS","Segoe UI",sans-serif; overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body { position:fixed; inset:0; box-sizing:border-box; display:flex;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #wrap { position:relative; flex:1; min-width:0; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hud { position:absolute; left:10px; top:8px; z-index:1; pointer-events:none; font-weight:700; line-height:1.3;
    text-shadow:0 2px 0 #0b2a4a,0 0 6px #0b2a4a; }
  #mute { position:absolute; top:6px; right:6px; z-index:3; width:44px; height:44px; padding:0; font-size:1.3rem;
    border:0; border-radius:50%; background:rgba(11,42,74,.6); color:#fff; cursor:pointer; }
  #ov { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    text-align:center; padding:1rem 1rem 1.2rem;
    background:linear-gradient(to bottom, rgba(11,42,74,0) 28%, rgba(11,42,74,.9) 68%); }
  #ov.hidden { display:none; }
  h1 { margin:0 0 .3rem; font-size:clamp(1.8rem,7vw,3.4rem); color:var(--gold); text-shadow:3px 3px 0 #000; }
  p { margin:.25rem 0; font-size:clamp(.8rem,2.1vw,1.05rem); line-height:1.4; }
  .picks { display:flex; gap:.5rem; margin:.6rem 0 .2rem; }
  .pick { font:inherit; font-size:.85rem; color:#fff; background:rgba(255,255,255,.14); border:2px solid transparent;
    border-radius:14px; padding:.45rem .8rem; cursor:pointer; min-width:84px; }
  .pick span { display:block; font-size:1.8rem; }
  .pick[aria-pressed="true"] { border-color:var(--gold); background:rgba(255,201,60,.28); }
  #btn { margin-top:.7rem; font:inherit; font-weight:700; font-size:1.1rem; padding:.7rem 2rem; border:0;
    border-radius:999px; background:var(--gold); color:var(--navy); cursor:pointer; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  .credit { font-size:.7rem; opacity:.75; margin-top:.7rem; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" hidden></div>
  <audio id="music" src="tropical-loop.wav" loop preload="auto"></audio>
  <button id="mute" aria-label="Toggle sound">🔊</button>
  <div id="ov">
    <h1 id="ttl">Bahama Rush 3D</h1>
    <p id="msg">Pick your runner, then race down the shoreline. Dodge coral, hop crates, slide under the limbo bar.</p>
    <div class="picks">
      <button class="pick" data-c="shark"><span>🦈</span>Shark Man</button>
      <button class="pick" data-c="pine"><span>🍍</span>Pineapple Dude</button>
      <button class="pick" data-c="fish"><span>🐠</span>Fish Girl</button>
    </div>
    <p>← → lane &nbsp;·&nbsp; ↑ / Space jump &nbsp;·&nbsp; ↓ slide &nbsp;·&nbsp; swipe on mobile</p>
    <button id="btn">Start</button>
    <p class="credit">Music: “Tropical Loop 1” by chrisbutler99 (freesound.org)</p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const T = THREE, R = Math.random, LW = 2.1, TL = 10, NT = 14;
  const $ = id => document.getElementById(id);
  const wrap = $("wrap"), ov = $("ov"), btn = $("btn"), ttl = $("ttl"), msg = $("msg"), hud = $("hud"), music = $("music"), muteBtn = $("mute");
  let best = 0, pick = "shark";
  try { best = +localStorage.getItem("bbBest") || 0; pick = localStorage.getItem("bbChar") || "shark"; } catch (e) {}

  /* ---------- scene ---------- */
  const renderer = new T.WebGLRenderer({ antialias: true }), cv = renderer.domElement;
  wrap.insertBefore(cv, wrap.firstChild);
  const scene = new T.Scene(); scene.fog = new T.Fog(0xcdf3ff, 25, 110);
  const cam = new T.PerspectiveCamera(62, 1, .1, 300);
  { const c = document.createElement("canvas"); c.width = 2; c.height = 256; const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, "#37c5ee"); g.addColorStop(.55, "#9fe6f7"); g.addColorStop(1, "#cdf3ff"); x.fillStyle = g; x.fillRect(0, 0, 2, 256);
    scene.background = new T.CanvasTexture(c); }
  scene.add(new T.HemisphereLight(0xdff6ff, 0xffd9b8, .95));
  const sun = new T.DirectionalLight(0xffffff, .75); sun.position.set(5, 12, 6); scene.add(sun);

  const M = c => new T.MeshLambertMaterial({ color: c });
  const mesh = (geo, c, x = 0, y = 0, z = 0, p) => { const m = new T.Mesh(geo, c.isMaterial ? c : M(c)); m.position.set(x, y, z); if (p) p.add(m); return m; };
  const B = (w, h, d) => new T.BoxGeometry(w, h, d), C = (a, b, h, s = 10) => new T.CylinderGeometry(a, b, h, s),
        S_ = r => new T.SphereGeometry(r, 14, 10), K = (r, h, s = 8) => new T.ConeGeometry(r, h, s);
  const limb = (g, x, y, len, r, c) => { const p = new T.Group(); p.position.set(x, y, 0); mesh(C(r, r, len, 8), c, 0, -len / 2, 0, p); g.add(p); return p; };

  /* ---------- characters (they face -z, camera sees their backs) ---------- */
  function shark() {
    const g = new T.Group(), sk = 0x5b82ad, dk = 0x3b5878;
    mesh(C(.45, .4, .9), sk, 0, 1.5, 0, g);
    mesh(C(.47, .47, .32), 0x00b4c8, 0, 1.08, 0, g); mesh(C(.48, .48, .08), 0xffc93c, 0, 1.1, 0, g); mesh(C(.47, .47, .1), 0x111111, 0, 1.0, 0, g);
    mesh(S_(.4), 0x6a93bd, 0, 2.25, 0, g);
    mesh(K(.16, .4), 0x6a93bd, 0, 2.18, -.45, g).rotation.x = -Math.PI / 2;
    mesh(S_(.06), 0x111111, -.17, 2.33, -.33, g); mesh(S_(.06), 0x111111, .17, 2.33, -.33, g);
    const f = mesh(K(.3, .9, 4), dk, 0, 2.0, .42, g); f.scale.z = .3; f.rotation.x = .35;
    mesh(K(.12, .45, 4), dk, 0, 2.75, 0, g);
    return { g, legs: [limb(g, -.2, 1, .98, .14, sk), limb(g, .2, 1, .98, .14, sk)], arms: [limb(g, -.62, 1.9, .85, .11, sk), limb(g, .62, 1.9, .85, .11, sk)] };
  }
  function pineTex() {
    const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
    x.fillStyle = "#ffd23f"; x.fillRect(0, 0, 64, 64); x.strokeStyle = "#d98a1c"; x.lineWidth = 3;
    for (let i = -64; i < 128; i += 16) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 64, 64); x.moveTo(i + 64, 0); x.lineTo(i, 64); x.stroke(); }
    const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(3, 2); return t;
  }
  function pine() {
    const g = new T.Group(), og = 0xe8892b, lf = 0x2e9d4a;
    mesh(S_(.62), new T.MeshLambertMaterial({ map: pineTex() }), 0, 1.55, 0, g).scale.set(.85, 1.2, .85);
    for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283; mesh(K(.14, .9, 4), lf, Math.sin(a) * .2, 3.0, Math.cos(a) * .2, g).rotation.set(Math.cos(a) * .5, 0, -Math.sin(a) * .5); }
    mesh(K(.15, 1.1, 4), lf, 0, 3.15, 0, g);
    mesh(B(.22, .16, .05), 0x111111, -.2, 1.95, -.47, g); mesh(B(.22, .16, .05), 0x111111, .2, 1.95, -.47, g); mesh(B(.5, .05, .05), 0x111111, 0, 1.97, -.47, g);
    mesh(B(.22, .06, .05), 0xd62839, 0, 1.6, -.5, g);
    return { g, legs: [limb(g, -.22, 1, 1, .09, og), limb(g, .22, 1, 1, .09, og)], arms: [limb(g, -.6, 1.8, .8, .08, og), limb(g, .6, 1.8, .8, .08, og)] };
  }
  function fish() {
    const g = new T.Group(), sk = 0x2ec4b6, pk = 0xff6fb5;
    mesh(C(.3, .42, .95), 0xb86bff, 0, 1.45, 0, g);
    mesh(S_(.42), sk, 0, 2.25, 0, g).scale.x = 1.1;
    for (const s of [-1, 1]) { mesh(S_(.15), 0xffffff, s * .3, 2.32, -.25, g); mesh(S_(.07), 0x111111, s * .32, 2.33, -.37, g); mesh(S_(.11), 0xffc93c, s * .3, 2.65, -.05, g); }
    const df = mesh(K(.3, .7, 4), pk, 0, 2.78, .12, g); df.scale.z = .25; df.rotation.x = .4;
    const tl = mesh(K(.4, .8, 3), pk, 0, 1.0, .6, g); tl.rotation.x = Math.PI / 2; tl.scale.x = .3;
    return { g, legs: [limb(g, -.2, 1, 1, .1, sk), limb(g, .2, 1, 1, .1, sk)], arms: [limb(g, -.5, 1.85, .8, .09, sk), limb(g, .5, 1.85, .8, .09, sk)] };
  }
  const CH = { shark, pine, fish }, P = new T.Group(); scene.add(P);
  let model;
  function choose(k) {
    pick = CH[k] ? k : "shark"; try { localStorage.setItem("bbChar", pick); } catch (e) {}
    if (model) P.remove(model.g);
    model = CH[pick](); model.g.scale.setScalar(.62); P.add(model.g);
    document.querySelectorAll(".pick").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === pick));
  }
  document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => choose(b.dataset.c)));

  /* ---------- world ---------- */
  const tiles = [];
  for (let i = 0; i < NT; i++) {
    const t = new T.Group(), a = i % 2;
    mesh(B(300, .1, TL), a ? 0x17bccb : 0x25d0d9, 0, -.6, 0, t);
    mesh(B(12, .5, TL), 0xfbe3c4, 0, -.3, 0, t);
    mesh(B(6.6, .6, TL), a ? 0xf4a3b4 : 0xf8b8c5, 0, -.25, 0, t);
    if (a) { mesh(B(.08, .05, TL), 0xffffff, -LW / 2, .06, 0, t); mesh(B(.08, .05, TL), 0xffffff, LW / 2, .06, 0, t); }
    t.position.z = TL * 1.8 - i * TL; scene.add(t); tiles.push(t);
  }
  function palm() {
    const g = new T.Group(); mesh(C(.14, .2, 3.6, 6), 0x8a5a2b, 0, 1.8, 0, g);
    for (let i = 0; i < 6; i++) { const p = new T.Group(); p.position.y = 3.6; p.rotation.set(0, i * 1.047, -.3);
      const f = mesh(K(.2, 1.7, 4), 0x1f9a52, .85, 0, 0, p); f.rotation.z = -Math.PI / 2; f.scale.z = .4; g.add(p); }
    return g;
  }
  const PASTEL = [0xffd166, 0xff9ec0, 0x8ee3d4, 0xb9a3ff, 0xffb48a];
  function house(side) {
    const g = new T.Group(); mesh(B(1.8, 1.5, 1.8), PASTEL[(R() * 5) | 0], 0, .75, 0, g);
    mesh(B(2.1, .2, 2.1), 0xffffff, 0, 1.6, 0, g); mesh(B(.4, .7, .05), 0x0b2a4a, 0, .35, .92, g);
    mesh(B(.4, .4, .05), 0x0b2a4a, .55, 1.0, .92, g); mesh(B(.4, .4, .05), 0x0b2a4a, -.55, 1.0, .92, g);
    g.rotation.y = -side * Math.PI / 2; return g;
  }
  const scen = [];
  for (const side of [-1, 1]) for (let i = 0; i < 8; i++) {
    const hs = i % 2, g = hs ? house(side) : palm();
    g.position.set(side * (hs ? 5 : 4.4 + R() * 1.2), 0, 16 - i * 16 - (side > 0 ? 8 : 0)); scene.add(g); scen.push(g);
  }
  const wakeM = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .55 }), sharks = [];
  for (let i = 0; i < 6; i++) {
    const g = new T.Group(), f = mesh(K(.45, 1.1, 4), 0x3b4f66, 0, -.05, 0, g); f.scale.z = .25;
    mesh(C(.9, .9, .04, 16), wakeM, 0, -.54, 0, g);
    g.position.set((i % 2 ? 1 : -1) * (8 + R() * 8), 0, -i * 20 - 6); g.userData = { sp: 6 + R() * 8, ph: R() * 6 };
    scene.add(g); sharks.push(g);
  }
  const bm = new T.MeshBasicMaterial({ color: 0x27405e, fog: false, side: T.DoubleSide }), birds = [];
  for (let i = 0; i < 8; i++) {
    const g = new T.Group(), w = [];
    for (const s of [-1, 1]) { const p = new T.Group(); mesh(B(.9, .04, .32), bm, s * .45, 0, 0, p); g.add(p); w.push(p); }
    mesh(S_(.1), bm, 0, 0, 0, g); g.scale.setScalar(1.6);
    g.position.set(-45 + R() * 90, 9 + R() * 12, -45 - R() * 50); g.userData = { w, vx: (R() < .5 ? -1 : 1) * (2 + R() * 3), ph: R() * 6 };
    scene.add(g); birds.push(g);
  }
  mesh(S_(8), new T.MeshBasicMaterial({ color: 0xfff2a8, fog: false }), 40, 26, -130, scene);
  for (let i = 0; i < 5; i++) { const c = new T.Group(), cm = new T.MeshBasicMaterial({ color: 0xffffff, fog: false });
    for (let j = 0; j < 3; j++) mesh(S_(3 + R() * 2), cm, j * 4 - 4, R() * 1.5, 0, c).scale.y = .5;
    c.position.set(-70 + i * 35, 20 + R() * 8, -120); scene.add(c); }

  /* ---------- obstacles ---------- */
  const coral = () => { const g = new T.Group(); mesh(B(1.5, 2, 1.1), 0xff6b6b, 0, 1, 0, g);
    for (const x of [-.5, 0, .5]) mesh(S_(.4), 0xff8f6b, x, 2, 0, g); mesh(B(.25, 1.6, 1.12), 0xd94a5a, 0, .9, 0, g); return g; };
  const crate = () => { const g = new T.Group(); mesh(B(1.5, .85, 1.2), 0xb9732f, 0, .42, 0, g);
    mesh(B(1.52, .12, 1.22), 0x00b4c8, 0, .8, 0, g); mesh(B(1.52, .12, 1.22), 0xffc93c, 0, .06, 0, g); return g; };
  const limbo = () => { const g = new T.Group();
    for (const x of [-.95, .95]) mesh(C(.08, .08, 1.7, 6), 0x6b4423, x, .85, 0, g);
    for (let i = 0; i < 8; i++) mesh(B(.24, .2, .2), i % 2 ? 0xffffff : 0xe63946, -.83 + i * .237, 1.15, 0, g); return g; };
  const cg = C(.34, .34, .08, 16), cmat = new T.MeshLambertMaterial({ color: 0xffc93c, emissive: 0x664400 });
  const mkCoin = () => { const g = new T.Group(), m = new T.Mesh(cg, cmat); m.rotation.x = Math.PI / 2; g.add(m); return g; };

  /* ---------- game state ---------- */
  let S, obs = [], coins = [], mode = "idle", dieT = 0, last = performance.now(), camZ = 9, camY = 5, hs = "";
  const score = () => Math.floor(S.dist) + S.coins * 10;
  function reset() {
    [...obs, ...coins].forEach(o => scene.remove(o.m)); obs = []; coins = [];
    S = { dist: 0, v: 14, lane: 0, target: 0, h: 0, vy: 0, slide: 0, coins: 0, t: 0, lean: 0, next: 18 };
  }
  function spawn() {
    const z = -95, lane = ((R() * 3) | 0) - 1, r = R();
    const other = () => ((lane + 1 + ((R() * 2) | 0)) % 3) - 1;
    const add = (t, l) => { const m = t === "coral" ? coral() : t === "crate" ? crate() : limbo(); m.position.set(l * LW, 0, z); scene.add(m); obs.push({ m, lane: l, type: t }); };
    const coin = (l, dz) => { const m = mkCoin(); m.position.set(l * LW, .9, z + dz); scene.add(m); coins.push({ m, lane: l }); };
    if (r < .3) { add("crate", lane); if (R() < .6) for (let i = 0; i < 4; i++) coin(other(), 6 - i * 3); }
    else if (r < .55) { add("limbo", lane); for (let i = 0; i < 4; i++) coin(lane, -5 - i * 3); }
    else if (r < .85) {
      add("coral", lane); let second = -9; if (R() < .5) { second = other(); add("coral", second); }
      const free = [-1, 0, 1].filter(l => l !== lane && l !== second)[0]; for (let i = 0; i < 5; i++) coin(free, 4 - i * 3);
    } else for (let i = 0; i < 7; i++) coin(lane, -i * 3);
  }

  function scroll(dt, v, now) {
    tiles.forEach(t => { t.position.z += v * dt; if (t.position.z > TL * 1.8) t.position.z -= NT * TL; });
    scen.forEach(g => { g.position.z += v * dt; if (g.position.z > 18) g.position.z -= 128; });
    sharks.forEach(g => { g.position.z += (v - Math.min(g.userData.sp, v * .8)) * dt;
      if (g.position.z > 18) { g.position.z -= 140; g.position.x = Math.sign(g.position.x) * (8 + R() * 8); }
      g.position.y = Math.sin(now * 2 + g.userData.ph) * .05; });
  }

  function update(dt, now) {
    S.t += dt; S.dist += S.v * dt; S.v = Math.min(14 + S.dist * .004, 30);
    S.lane += (S.target - S.lane) * Math.min(1, 12 * dt); S.lean += ((S.target - S.lane) - S.lean) * Math.min(1, 10 * dt);
    S.vy -= 28 * dt; S.h += S.vy * dt; if (S.h <= 0) { S.h = 0; S.vy = 0; }
    if (S.slide > 0) S.slide -= dt;
    scroll(dt, S.v, now);
    S.next -= S.v * dt; if (S.next <= 0) { spawn(); S.next = Math.max(12, 10 + S.v * .5 + R() * 8); }
    obs.forEach(o => { o.m.position.z += S.v * dt; });
    for (const o of obs) { const z = o.m.position.z;
      if (z > -.75 && z < .75 && Math.abs(S.lane - o.lane) < .6 &&
          (o.type === "coral" || (o.type === "crate" && S.h < .85) || (o.type === "limbo" && S.slide <= 0))) { mode = "dying"; dieT = .8; return; } }
    obs = obs.filter(o => { if (o.m.position.z > 6) { scene.remove(o.m); return false; } return true; });
    coins = coins.filter(c => { const z = (c.m.position.z += S.v * dt); c.m.rotation.y += dt * 5;
      if (Math.abs(z) < .9 && Math.abs(S.lane - c.lane) < .6) { scene.remove(c.m); S.coins++; return false; }
      if (z > 6) { scene.remove(c.m); return false; } return true; });
  }

  function pose() {
    const run = mode === "run", s = run ? Math.sin(S.t * 12) : 0, air = S.h > .05, sl = run && S.slide > 0 && !air;
    model.legs[0].rotation.x = air ? -.9 : s * .9; model.legs[1].rotation.x = air ? .5 : -s * .9;
    model.arms[0].rotation.x = air ? -2.4 : -s * .9; model.arms[1].rotation.x = air ? -2.4 : s * .9;
    model.g.rotation.x = sl ? 1.3 : 0; model.g.position.y = sl ? .22 : 0;
    P.position.set(S.lane * LW, S.h, 0); P.rotation.z = -S.lean * .25;
  }

  const cp = new T.Vector3(), lk = new T.Vector3(), look = new T.Vector3(0, .4, 0);
  cam.position.set(0, 2.6, 5.4);
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min((t - last) / 1000, .033), now = t / 1000; last = t;
    if (mode === "run") update(dt, now);
    else if (mode === "idle") { S.t += dt; scroll(dt, 4, now); P.rotation.y += dt * 1.1; }
    else { dieT -= dt; P.rotation.x = Math.max(P.rotation.x - dt * 4, -1.4); if (dieT <= 0) showOver(); }
    birds.forEach(b => { const u = b.userData; b.position.x += u.vx * dt; if (Math.abs(b.position.x) > 55) b.position.x *= -.98;
      const f = Math.sin(now * 9 + u.ph) * .5; u.w[0].rotation.z = f; u.w[1].rotation.z = -f; });
    pose();
    if (mode === "idle") { cp.set(0, 2.6, 5.4); lk.set(0, .4, 0); } else { cp.set(P.position.x * .45, camY, camZ); lk.set(P.position.x * .3, 1, -12); }
    const k = 1 - Math.exp(-5 * dt); cam.position.lerp(cp, k); look.lerp(lk, k); cam.lookAt(look);
    if (mode !== "idle") { const h = `<div style="font-size:1.5rem">${score()} pts</div><div style="color:#ffc93c">Sand dollars ${S.coins}</div><div>Best ${best}</div>`;
      if (h !== hs) { hs = h; hud.innerHTML = h; } }
    renderer.render(scene, cam);
  }

  function start() {
    reset(); P.rotation.set(0, 0, 0); mode = "run"; hud.hidden = false; ov.classList.add("hidden"); playMusic();
  }
  function showOver() {
    const sc = score(); if (sc > best) { best = sc; try { localStorage.setItem("bbBest", best); } catch (e) {} }
    ttl.textContent = "Wiped out!"; msg.textContent = "Score " + sc + "  ·  Best " + best + "  ·  Sand dollars " + S.coins;
    btn.textContent = "Run again"; reset(); P.rotation.set(0, 0, 0); mode = "idle"; hud.hidden = true; ov.classList.remove("hidden"); btn.focus();
  }

  /* ---------- input ---------- */
  const move = d => { if (mode === "run") S.target = Math.max(-1, Math.min(1, S.target + d)); };
  const jump = () => { if (mode === "run" && S.h === 0) { S.vy = 10; S.slide = 0; } };
  const slide = () => { if (mode === "run") { S.slide = .7; if (S.h > 0) S.vy = Math.min(S.vy, -12); } };
  addEventListener("keydown", e => {
    const k = e.code;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) e.preventDefault();
    if (mode === "idle" && (k === "Space" || k === "Enter")) return start();
    if (k === "ArrowLeft" || k === "KeyA") move(-1); else if (k === "ArrowRight" || k === "KeyD") move(1);
    else if (k === "ArrowUp" || k === "KeyW" || k === "Space") jump(); else if (k === "ArrowDown" || k === "KeyS") slide();
  });
  let sx = null, sy, acted = false;
  cv.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; acted = false; });
  cv.addEventListener("pointermove", e => {
    if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) < 28) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1); else if (dy > 0) slide(); else jump();
    acted = true; sx = e.clientX; sy = e.clientY;
  });
  cv.addEventListener("pointerup", () => { if (sx != null && !acted) jump(); sx = null; });
  cv.addEventListener("pointercancel", () => { sx = null; });
  btn.addEventListener("click", start);
  addEventListener("contextmenu", e => e.preventDefault());

  /* ---------- audio ---------- */
  let musicOn = false;
  function playMusic() { musicOn = true; music.volume = .6; music.play().catch(() => {}); }
  muteBtn.addEventListener("click", () => { music.muted = !music.muted; muteBtn.textContent = music.muted ? "🔇" : "🔊"; });
  document.addEventListener("visibilitychange", () => { if (document.hidden) music.pause(); else if (musicOn) music.play().catch(() => {}); });

  /* ---------- sizing ---------- */
  function resize() {
    const r = wrap.getBoundingClientRect(), a = r.width / r.height;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(r.width, r.height, false);
    cam.aspect = a; cam.updateProjectionMatrix();
    camZ = Math.min(13, Math.max(7, 3.4 / (Math.tan(cam.fov * Math.PI / 360) * a))); camY = 3.6 + camZ * .2;
  }
  addEventListener("resize", resize); addEventListener("orientationchange", () => setTimeout(resize, 150));

  choose(pick); reset(); resize(); requestAnimationFrame(frame);
})();
</script>
</body>
