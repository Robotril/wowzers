<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shark Man Run: Bahama Rush</title>
<style>
  :root { --navy:#0b2a4a; --aqua:#00b4c8; --gold:#ffc93c; --pink:#f6a5b5; color-scheme: dark; }
  html,body { height:100%; margin:0; background:var(--navy); color:#fff; overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",sans-serif; touch-action:none; }
  html,body { overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body { position:fixed; inset:0; box-sizing:border-box; display:flex;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #wrap { position:relative; flex:1; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; border-radius:6px; }
  #mute { position:absolute; top:6px; right:6px; z-index:3; margin:0; padding:0; width:44px; height:44px;
    font-size:1.3rem; background:rgba(11,42,74,.6); color:#fff; }
  .credit { font-size:.7rem; opacity:.75; margin-top:.9rem; }
  #ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:1rem; background:rgba(11,42,74,.74); border-radius:6px; }
  #ov.hidden { display:none; }
  h1 { margin:0 0 .3rem; font-size:clamp(1.8rem,6.5vw,3.6rem); color:var(--gold); text-shadow:3px 3px 0 #000; letter-spacing:.03em; }
  p { margin:.25rem 0; font-size:clamp(.8rem,2.1vw,1.1rem); line-height:1.4; }
  button { margin-top:1rem; font:inherit; font-weight:700; font-size:1.1rem; padding:.7rem 1.8rem; border:0;
    border-radius:999px; background:var(--gold); color:var(--navy); cursor:pointer; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="Shark Man Run game"></canvas>
  <audio id="music" src="tropical-loop.wav" loop preload="auto"></audio>
  <button id="mute" aria-label="Toggle sound">🔊</button>
  <div id="ov">
    <h1 id="ttl">Shark Man Run</h1>
    <p id="msg">Race down the Bahama shoreline. Dodge coral, hop crates, slide under the limbo bar, grab sand dollars.</p>
    <p>← → change lane &nbsp;·&nbsp; ↑ / Space jump &nbsp;·&nbsp; ↓ slide<br>Mobile: swipe left, right, up, down</p>
    <button id="btn">Start</button>
    <p class="credit">Music: “Tropical Loop 1” by chrisbutler99 (freesound.org)</p>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let W = 800, H = 450, HZ = 165, GY = 385, LANE = 130, CX = 400, K = 1, PK = 1, SC = 1;
  const D = 12;
  const wrap = document.getElementById("wrap"), music = document.getElementById("music"), muteBtn = document.getElementById("mute");
  const ov = document.getElementById("ov"), btn = document.getElementById("btn");
  const ttl = document.getElementById("ttl"), msg = document.getElementById("msg");
  const R = Math.random;
  let best = 0;
  try { best = +localStorage.getItem("sharkRunBest") || 0; } catch (e) {}

  let S, scenery, obs, coins, sharks, birds, running = false, last = 0;

  const proj = z => 1 / (1 + z / D);
  const curveOff = p => S.curve * (1 - p) * (1 - p) * W * .25;
  const xAt = (wx, p) => CX + curveOff(p) + wx * p;
  const yAt = p => HZ + (GY - HZ) * p;

  function reset() {
    S = { dist: 0, v: 14, lane: 0, target: 0, h: 0, vy: 0, slide: 0, coins: 0, t: 0, curve: 0, next: 20, lean: 0, flash: 0 };
    obs = []; coins = []; scenery = [];
    sharks = Array.from({ length: 6 }, (_, i) => ({ z: 15 + i * 18 + R() * 8, side: i % 2 ? 1 : -1, f: 2.7 + R() * 1.5, sp: 6 + R() * 8, ph: R() * 6 }));
    birds = Array.from({ length: 7 }, () => ({ x: R() * W, y: 20 + R() * (HZ - 70), v: 15 + R() * 30, s: .7 + R() * .8, ph: R() * 6 }));
    for (let i = 0; i < 12; i++) for (const side of [-1, 1])
      scenery.push({ z: i * 10 + R() * 4, side, kind: R() < .6 ? 0 : 1, f: 1.75 + R() * .2, c: (R() * 5) | 0 });
  }

  function spawn() {
    const z = 95, lane = ((R() * 3) | 0) - 1, r = R();
    if (r < .3) {
      obs.push({ z, lane, type: "crate" });
      if (R() < .6) for (let i = 0; i < 4; i++) coins.push({ z: z - 6 + i * 3, lane: ((lane + 1 + ((R() * 2) | 0)) % 3) - 1 });
    } else if (r < .55) {
      obs.push({ z, lane, type: "limbo" });
      for (let i = 0; i < 4; i++) coins.push({ z: z + 5 + i * 3, lane });
    } else if (r < .85) {
      obs.push({ z, lane, type: "coral" });
      if (R() < .5) obs.push({ z, lane: ((lane + 1 + ((R() * 2) | 0)) % 3) - 1 === lane ? lane : ((lane + 2) % 3) - 1, type: "coral" });
      const free = [-1, 0, 1].filter(l => !obs.some(o => o.z === z && o.lane === l))[0];
      if (free !== undefined) for (let i = 0; i < 5; i++) coins.push({ z: z - 4 + i * 3, lane: free });
    } else {
      for (let i = 0; i < 7; i++) coins.push({ z: z + i * 3, lane });
    }
  }

  function over() {
    running = false;
    const sc = score();
    if (sc > best) { best = sc; try { localStorage.setItem("sharkRunBest", best); } catch (e) {} }
    ttl.textContent = "Wiped out!";
    msg.textContent = "Score " + sc + "  ·  Best " + best + "  ·  Sand dollars " + S.coins;
    btn.textContent = "Run again";
    ov.classList.remove("hidden"); btn.focus();
  }
  const score = () => Math.floor(S.dist) + S.coins * 10;

  function update(dt) {
    S.t += dt; S.dist += S.v * dt; S.v = Math.min(14 + S.dist * 0.004, 30);
    S.curve += (Math.sin(S.dist / 170) - S.curve) * dt * 2;
    const prev = S.lane; S.lane += (S.target - S.lane) * Math.min(1, 12 * dt);
    S.lean += ((S.target - S.lane) - S.lean) * Math.min(1, 10 * dt);
    S.vy -= 1900 * dt; S.h += S.vy * dt; if (S.h <= 0) { S.h = 0; S.vy = 0; }
    if (S.slide > 0) S.slide -= dt;
    S.flash = Math.max(0, S.flash - dt);

    S.next -= S.v * dt;
    if (S.next <= 0) { spawn(); S.next = Math.max(11, 9 + S.v * .5 + R() * 8); }
    for (const a of [obs, coins]) a.forEach(o => o.z -= S.v * dt);
    scenery.forEach(s => { s.z -= S.v * dt; if (s.z < -4) { s.z += 120; s.kind = R() < .6 ? 0 : 1; s.c = (R() * 5) | 0; s.f = 1.75 + R() * .2; } });
    sharks.forEach(s => { s.z -= (S.v - s.sp) * dt; if (s.z < -5) { s.z += 110; s.f = 2.7 + R() * 1.5; s.sp = 6 + R() * 8; } });
    birds.forEach(b => { b.x += b.v * dt; if (b.x > W + 30) { b.x = -30; b.y = 20 + R() * (HZ - 70); } });
    obs = obs.filter(o => o.z > -5);

    for (const o of obs) {
      if (o.z > -0.8 && o.z < 0.9 && Math.abs(S.lane - o.lane) < .55) {
        const hit = o.type === "coral" || (o.type === "crate" && S.h < 45) || (o.type === "limbo" && S.slide <= 0);
        if (hit) { S.flash = .3; over(); return; }
      }
    }
    for (const c of coins) if (!c.got && c.z > -0.8 && c.z < 1 && Math.abs(S.lane - c.lane) < .6) { c.got = 1; S.coins++; }
    coins = coins.filter(c => !c.got && c.z > -5);
  }

  /* ---------- drawing ---------- */
  function bg() {
    const g = ctx.createLinearGradient(0, 0, 0, HZ);
    g.addColorStop(0, "#37c5ee"); g.addColorStop(1, "#c9f4ff");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ + 2);
    ctx.fillStyle = "#fff6b0"; ctx.beginPath(); ctx.arc(W * .75, 70, 34, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (let i = 0; i < 4; i++) { const x = ((i * 230 - S.dist * 1.5) % 900 + 900) % 900 - 60, y = 35 + (i % 2) * 40;
      ctx.fillRect(x, y, 90, 14); ctx.fillRect(x + 18, y - 10, 50, 12); }
    ctx.fillStyle = "#2e9d6b"; ctx.beginPath(); ctx.moveTo(100 + CX * S.curve * .1, HZ);
    ctx.quadraticCurveTo(160 + CX * S.curve * .1, HZ - 28, 240 + CX * S.curve * .1, HZ); ctx.fill();
    ctx.strokeStyle = "#27405e"; ctx.lineCap = "round";
    birds.forEach(b => { const w = Math.sin(S.t * 9 + b.ph) * 6 * b.s; ctx.lineWidth = 2 * b.s;
      ctx.beginPath(); ctx.moveTo(b.x - 12 * b.s, b.y + w); ctx.quadraticCurveTo(b.x - 5 * b.s, b.y - 6 * b.s, b.x, b.y);
      ctx.quadraticCurveTo(b.x + 5 * b.s, b.y - 6 * b.s, b.x + 12 * b.s, b.y + w); ctx.stroke(); });
  }

  function ground() {
    for (let y = HZ; y < H; y += 2) {
      const p = (y - HZ) / (GY - HZ); if (p < .002) continue;
      const z = D * (1 / p - 1), band = Math.floor((z + S.dist) / 6) % 2, cx = CX + curveOff(p);
      ctx.fillStyle = band ? "#17bccb" : "#25d0d9"; ctx.fillRect(0, y, W, 2);
      ctx.fillStyle = "#fbe3c4"; ctx.fillRect(cx - LANE * 2 * p, y, LANE * 4 * p, 2);
      ctx.fillStyle = band ? "#f4a3b4" : "#f8b8c5"; ctx.fillRect(cx - LANE * 1.55 * p, y, LANE * 3.1 * p, 2);
      if (band) { ctx.fillStyle = "rgba(255,255,255,.55)";
        for (const l of [-.5, .5]) ctx.fillRect(cx + l * LANE * p - p, y, Math.max(1, 2.5 * p), 2); }
    }
  }

  function palm(x, y, s) {
    ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth = Math.max(1, 9 * s); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 14 * s, y - 60 * s, x + 6 * s, y - 120 * s); ctx.stroke();
    ctx.fillStyle = "#1f9a52";
    for (let i = 0; i < 6; i++) { ctx.save(); ctx.translate(x + 6 * s, y - 120 * s); ctx.rotate(-1.4 + i * .56);
      ctx.beginPath(); ctx.ellipse(34 * s, 0, 38 * s, 7 * s, 0, 0, 7); ctx.fill(); ctx.restore(); }
  }
  const PASTEL = ["#ffd166", "#ff9ec0", "#8ee3d4", "#b9a3ff", "#ffb48a"];
  function house(x, y, s, c) {
    ctx.fillStyle = PASTEL[c]; ctx.fillRect(x - 45 * s, y - 75 * s, 90 * s, 75 * s);
    ctx.fillStyle = "#fff"; ctx.fillRect(x - 52 * s, y - 85 * s, 104 * s, 12 * s);
    ctx.fillStyle = "#0b2a4a"; ctx.fillRect(x - 32 * s, y - 55 * s, 18 * s, 22 * s); ctx.fillRect(x + 12 * s, y - 55 * s, 18 * s, 22 * s);
    ctx.fillRect(x - 8 * s, y - 32 * s, 16 * s, 32 * s);
  }

  function drawObs(o) {
    const p = proj(o.z), x = xAt(o.lane * LANE, p), y = yAt(p), s = p * K;
    if (o.type === "coral") {
      ctx.fillStyle = "#ff6b6b"; ctx.fillRect(x - 40 * s, y - 100 * s, 80 * s, 100 * s);
      ctx.fillStyle = "#ff8f6b"; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(x + i * 26 * s, y - 100 * s, 17 * s, 0, 7); ctx.fill(); }
      ctx.fillStyle = "#d94a5a"; ctx.fillRect(x - 6 * s, y - 80 * s, 12 * s, 80 * s);
    } else if (o.type === "crate") {
      ctx.fillStyle = "#b9732f"; ctx.fillRect(x - 42 * s, y - 48 * s, 84 * s, 48 * s);
      ctx.fillStyle = "#00b4c8"; ctx.fillRect(x - 42 * s, y - 48 * s, 84 * s, 9 * s);
      ctx.fillStyle = "#ffc93c"; ctx.fillRect(x - 42 * s, y - 9 * s, 84 * s, 9 * s);
      ctx.fillStyle = "#fff3d6"; ctx.beginPath(); ctx.ellipse(x, y - 25 * s, 13 * s, 9 * s, 0, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = "#6b4423"; ctx.fillRect(x - 62 * s, y - 95 * s, 10 * s, 95 * s); ctx.fillRect(x + 52 * s, y - 95 * s, 10 * s, 95 * s);
      for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? "#fff" : "#e63946"; ctx.fillRect(x - 62 * s + i * 15.5 * s, y - 72 * s, 15.5 * s, 12 * s); }
    }
  }

  function drawFin(s) {
    const p = proj(s.z), x = xAt(s.side * s.f * LANE, p), y = yAt(p), w = 46 * p, b = Math.sin(S.t * 3 + s.ph) * 2 * p;
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.beginPath(); ctx.ellipse(x, y, w * 1.2, 6 * p, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#3b4f66"; ctx.beginPath(); ctx.moveTo(x - w * .5, y);
    ctx.quadraticCurveTo(x - w * .1, y - 20 * p, x + w * .1, y - 42 * p + b);
    ctx.quadraticCurveTo(x + w * .2, y - 14 * p, x + w * .55, y); ctx.fill();
  }

  function drawCoin(c) {
    const p = proj(c.z), x = xAt(c.lane * LANE, p), y = yAt(p) - 32 * p, w = Math.abs(Math.cos(S.t * 5 + c.z)) * 14 * p + 2;
    ctx.fillStyle = "#ffc93c"; ctx.strokeStyle = "#b8860b"; ctx.lineWidth = Math.max(1, 2 * p);
    ctx.beginPath(); ctx.ellipse(x, y, w, 14 * p, 0, 0, 7); ctx.fill(); ctx.stroke();
  }

  function shark() {
    const x = CX + S.lane * LANE, sl = S.slide > 0 && S.h === 0, ph = S.t * 14, run = running ? Math.sin(ph) : 0;
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(x, GY + 4, 30 - S.h * .12, 8, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(x, GY - S.h); ctx.rotate(S.lean * .18); ctx.scale(PK, PK);
    if (sl) { ctx.scale(1, .55); ctx.translate(0, 0); }
    const tuck = S.h > 0;
    ctx.fillStyle = "#4d6f94"; // legs
    ctx.fillRect(-18, -34 + (tuck ? -8 : run * -5), 13, 34 - (tuck ? 10 : 0));
    ctx.fillRect(5, -34 + (tuck ? -8 : run * 5), 13, 34 - (tuck ? 10 : 0));
    ctx.fillStyle = "#34506e"; ctx.fillRect(-20, -4 + (tuck ? -12 : run * -5), 17, 6); ctx.fillRect(3, -4 + (tuck ? -12 : run * 5), 17, 6);
    // trunks in flag colours
    ctx.fillStyle = "#00b4c8"; ctx.fillRect(-22, -52, 44, 20);
    ctx.fillStyle = "#ffc93c"; ctx.fillRect(-22, -45, 44, 7);
    ctx.fillStyle = "#111"; ctx.fillRect(-22, -38, 44, 6);
    ctx.fillStyle = "#4d6f94"; ctx.fillRect(-22, -90, 44, 40);              // torso
    ctx.fillRect(-35, -88 + (tuck ? -10 : run * 6), 12, 34); ctx.fillRect(23, -88 + (tuck ? -10 : run * -6), 12, 34); // arms
    ctx.fillStyle = "#34506e";                                              // dorsal fin
    ctx.beginPath(); ctx.moveTo(-9, -88); ctx.lineTo(3, -128); ctx.lineTo(13, -86); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, -36); ctx.lineTo(0, -8 + Math.abs(run) * 4); ctx.lineTo(8, -36); ctx.fill(); // tail
    ctx.fillStyle = "#5c82aa"; ctx.beginPath(); ctx.ellipse(0, -104, 20, 18, 0, 0, 7); ctx.fill(); // head
    ctx.fillStyle = "#34506e"; ctx.beginPath(); ctx.moveTo(-20, -108); ctx.lineTo(-30, -96); ctx.lineTo(-18, -96); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20, -108); ctx.lineTo(30, -96); ctx.lineTo(18, -96); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(SC, 0, 0, SC, 0, 0); bg(); ground();
    const list = [];
    scenery.forEach(s => list.push([s.z, () => { const p = proj(s.z), x = xAt(s.side * s.f * LANE, p), y = yAt(p);
      s.kind ? house(x, y, p * 1.1, s.c) : palm(x, y, p * 1.1); }]));
    obs.forEach(o => list.push([o.z, () => drawObs(o)]));
    sharks.forEach(s => list.push([s.z, () => drawFin(s)]));
    coins.forEach(c => list.push([c.z, () => drawCoin(c)]));
    list.push([0, shark]);
    list.sort((a, b) => b[0] - a[0]).forEach(i => { if (i[0] > -4.5) i[1](); });
    if (S.flash > 0) { ctx.fillStyle = "rgba(255,255,255," + S.flash * 2 + ")"; ctx.fillRect(0, 0, W, H); }
    ctx.textAlign = "left"; ctx.font = "bold 24px 'Trebuchet MS',sans-serif"; ctx.lineWidth = 4; ctx.strokeStyle = "#0b2a4a";
    const t1 = score() + " pts", t2 = "Sand dollars " + S.coins, t3 = "Best " + best;
    ctx.fillStyle = "#fff"; ctx.strokeText(t1, 18, 34); ctx.fillText(t1, 18, 34);
    ctx.font = "bold 16px 'Trebuchet MS',sans-serif";
    ctx.fillStyle = "#ffc93c"; ctx.strokeText(t2, 18, 58); ctx.fillText(t2, 18, 58);
    ctx.fillStyle = "#fff"; ctx.strokeText(t3, 18, 80); ctx.fillText(t3, 18, 80);
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, .033); last = now;
    update(dt); draw();
    if (running) requestAnimationFrame(loop);
  }
  function start() { reset(); running = true; ov.classList.add("hidden"); playMusic(); last = performance.now(); requestAnimationFrame(loop); }

  const move = d => { if (running) S.target = Math.max(-1, Math.min(1, S.target + d)); };
  const jump = () => { if (running && S.h === 0) { S.vy = 640; S.slide = 0; } };
  const slide = () => { if (running) { S.slide = .7; if (S.h > 0) S.vy = Math.min(S.vy, -500); } };

  addEventListener("keydown", e => {
    const k = e.code;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) e.preventDefault();
    if (!running && !ov.classList.contains("hidden") && (k === "Space" || k === "Enter")) return start();
    if (k === "ArrowLeft" || k === "KeyA") move(-1);
    else if (k === "ArrowRight" || k === "KeyD") move(1);
    else if (k === "ArrowUp" || k === "KeyW" || k === "Space") jump();
    else if (k === "ArrowDown" || k === "KeyS") slide();
  });
  let sx = null, sy, acted = false;
  cv.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; acted = false; });
  cv.addEventListener("pointermove", e => {
    if (sx == null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) < 28) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1); else if (dy > 0) slide(); else jump();
    acted = true; sx = e.clientX; sy = e.clientY;
  });
  cv.addEventListener("pointerup", () => { if (sx != null && !acted) jump(); sx = null; });
  cv.addEventListener("pointercancel", () => { sx = null; });
  btn.addEventListener("click", start);

  let musicOn = false;
  function playMusic() { musicOn = true; music.volume = .6; music.play().catch(() => {}); }
  muteBtn.addEventListener("click", () => { music.muted = !music.muted; muteBtn.textContent = music.muted ? "🔇" : "🔊"; });
  document.addEventListener("visibilitychange", () => { if (document.hidden) music.pause(); else if (musicOn) music.play().catch(() => {}); });
  addEventListener("contextmenu", e => e.preventDefault());

  function resize() {
    const r = wrap.getBoundingClientRect(), a = r.width / r.height;
    if (a >= 1) { H = 450; W = Math.min(Math.round(450 * a), 800); } else { W = 450; H = Math.min(Math.round(450 / a), 980); }
    const fit = Math.min(r.width / W, r.height / H);
    cv.style.width = W * fit + "px"; cv.style.height = H * fit + "px";
    SC = fit * Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * SC); cv.height = Math.round(H * SC);
    HZ = Math.round(H * .37); GY = Math.round(H * .855); CX = W / 2;
    LANE = Math.min(130, W * .22); K = LANE / 130; PK = .5 + .5 * K;
    if (S && !running) draw();
  }
  addEventListener("resize", resize);
  addEventListener("orientationchange", () => setTimeout(resize, 150));

  resize(); reset(); draw();
})();
</script>
</body>
</html>
